# NAS 测试部署：docker compose up -d --build
# 网站 http://<NAS-IP>:3000   API http://<NAS-IP>:4000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ailearn
      POSTGRES_PASSWORD: ailearn
      POSTGRES_DB: ailearn
    volumes: [dbdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://ailearn:ailearn@db:5432/ailearn
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on: [db, redis]
    ports: ["4000:4000"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  dbdata:
